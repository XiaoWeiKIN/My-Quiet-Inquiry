<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="655" viewBox="0 0 1260 655" role="img" aria-label="德川家康姓名与远祖系谱分层"><rect width="1260" height="655" rx="22" fill="#F7F9FC"/><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#24354c} .title{font-size:28px;font-weight:700} .t{font-size:21px;font-weight:700} .s{font-size:16px;fill:#42566d} .note{font-size:14px;fill:#66778c} .solid{fill:none;stroke:#718ca2;stroke-width:3;stroke-linejoin:round} .dashed{fill:none;stroke:#c78a51;stroke-width:3;stroke-dasharray:8 8} </style>
<text class="title" x="42" y="61">德川：改名有公文记录，远祖系谱存在争论</text>
<text class="s" x="45" y="108">史料可核对的家族与改名事件（实线）</text>
<rect x="42" y="138" width="340" height="87" rx="12" fill="#def1e8" stroke="#b1c4d8"/><text class="t" x="212" y="169" text-anchor="middle">三河松平氏</text><text class="s" x="212" y="196" text-anchor="middle">家康的实际出身</text>
<path class="solid" d="M382 181 H440"/>
<rect x="440" y="138" width="340" height="87" rx="12" fill="#def1e8" stroke="#b1c4d8"/><text class="t" x="610" y="169" text-anchor="middle">1563 · 松平家康</text><text class="s" x="610" y="196" text-anchor="middle">由「元康」改个人名</text>
<path class="solid" d="M780 181 H836"/>
<rect x="836" y="138" width="382" height="87" rx="12" fill="#def1e8" stroke="#b1c4d8"/><text class="t" x="1027" y="169" text-anchor="middle">1566 · 德川家康</text><text class="s" x="1027" y="196" text-anchor="middle">改苗字并获朝廷任官</text>
<text class="s" x="45" y="290">后来家族采用的远祖叙述（虚线表示连线需考证）</text>
<rect x="55" y="327" width="310" height="84" rx="12" fill="#f9efdd" stroke="#b1c4d8"/><text class="t" x="210" y="358" text-anchor="middle">清和源氏／新田氏</text><text class="s" x="210" y="385" text-anchor="middle">名门祖先谱系主张</text>
<path class="dashed" d="M365 369 H464"/>
<rect x="464" y="327" width="310" height="84" rx="12" fill="#f9efdd" stroke="#b1c4d8"/><text class="t" x="619" y="358" text-anchor="middle">得川义季</text><text class="s" x="619" y="385" text-anchor="middle">历史上的新田分支</text>
<path class="dashed" d="M774 369 H830"/>
<rect x="830" y="327" width="380" height="84" rx="12" fill="#fff2e8" stroke="#b1c4d8"/><text class="t" x="1020" y="358" text-anchor="middle">三河松平氏</text><text class="s" x="1020" y="385" text-anchor="middle">逐代血缘证据不足</text>
<text class="note" x="46" y="484">德川的「苗字」与源／藤原等「本姓」身份需要分别追问；改苗字不等于证明每一代远祖血缘。</text>
<rect x="45" y="525" width="1170" height="80" rx="12" fill="#e9f0f8"/>
<text class="s" x="66" y="557">实线：国立公文书馆明确记载的名称变更与地方出身。</text>
<text class="s" x="66" y="582">虚线：族谱主张或政治身份解释；不能据此把 1566 年当作血统验证日期。</text>
</svg>